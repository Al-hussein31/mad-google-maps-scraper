name: Test 5 Queries - Self-Hosted Runners

on:
  workflow_dispatch:
    inputs:
      query_file:
        description: 'Query file to use (in queries/ folder)'
        required: true
        default: 'test_5_queries.txt'

jobs:
  test-scrape:
    runs-on: [self-hosted, maps-scraper]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Pull scraper image
        run: docker pull gosom/google-maps-scraper
      
      - name: Run scraper on test queries
        run: |
          QUERY_FILE="${{ github.event.inputs.query_file }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_FILE="test_results_${TIMESTAMP}.csv"
          
          # Find the actual repo root (handles nested checkout)
          REPO_ROOT=$(find /_work -name "queries" -type d 2>/dev/null | head -1 | sed 's|/queries||')
          if [ -z "$REPO_ROOT" ]; then
            REPO_ROOT="/_work/oci-a1-docker-01/mad-google-maps-scraper"
          fi
          
          echo "Repo root: $REPO_ROOT"
          echo "Query file: $REPO_ROOT/queries/${QUERY_FILE}"
          ls -la "$REPO_ROOT/queries/${QUERY_FILE}"
          
          docker run --rm \
            -v "${REPO_ROOT}:/data" \
            gosom/google-maps-scraper \
            -input "/data/queries/${QUERY_FILE}" \
            -results "/data/${OUTPUT_FILE}" \
            -depth 3 \
            -c 1 \
            -exit-on-inactivity 10m \
            -zoom 16
      
      - name: Show results preview
        run: |
          OUTPUT_FILE=$(ls test_results_*.csv | head -1)
          echo "=== Results preview ==="
          head -5 "$OUTPUT_FILE"
          echo "=== Row count ==="
          wc -l "$OUTPUT_FILE"
      
      - name: Copy to new_intake folder
        run: |
          OUTPUT_FILE=$(ls test_results_*.csv | head -1)
          DEST="/Users/MAC/Desktop/UNIFIED_LEADS/Forge Growth Outreach/new_intake/${OUTPUT_FILE}"
          mkdir -p "/Users/MAC/Desktop/UNIFIED_LEADS/Forge Growth Outreach/new_intake"
          cp "$OUTPUT_FILE" "$DEST"
          echo "Copied to $DEST"
          ls -la "/Users/MAC/Desktop/UNIFIED_LEADS/Forge Growth Outreach/new_intake/"
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-5-queries-results
          path: test_results_*.csv
          retention-days: 7