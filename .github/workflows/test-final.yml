name: Test Scrape Final

on:
  workflow_dispatch:
    inputs:
      run_test:
        description: 'Run test'
        required: false

jobs:
  test-scrape:
    runs-on: [self-hosted, maps-scraper]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Pull scraper image
        run: docker pull gosom/google-maps-scraper
      
      - name: Run scraper on test queries (docker cp, no bind mount)
        run: |
          set -e
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_FILE="test_results_${TIMESTAMP}.csv"

          # Generate test queries inline using echo commands
          echo "beauty salon Lagos" > test_queries.txt

          # Runner itself lives in a container (DooD), so bind-mounting
          # runner.workspace into a sibling container resolves on the HOST
          # filesystem, not this container's. Use docker create + docker cp
          # instead, which works regardless of host/container path mismatch.
          CID=$(docker create gosom/google-maps-scraper \
            -input "/test_queries.txt" \
            -results "/${OUTPUT_FILE}" \
            -depth 1 \
            -c 1 \
            -exit-on-inactivity 1m \
            -zoom 16)

          docker cp test_queries.txt "${CID}:/test_queries.txt"
          docker start -a "$CID"
          docker cp "${CID}:/${OUTPUT_FILE}" "./${OUTPUT_FILE}"
          docker rm "$CID" > /dev/null

          echo "OUTPUT_FILE=${OUTPUT_FILE}" >> "$GITHUB_ENV"

      - name: Show results preview
        run: |
          echo "=== Results preview ==="
          head -5 "$OUTPUT_FILE"
          echo "=== Row count ==="
          wc -l "$OUTPUT_FILE"

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-5-queries-results
          path: test_results_*.csv
          retention-days: 7